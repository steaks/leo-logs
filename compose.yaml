services:
  leo-logs:
    build: .
    restart: unless-stopped
    environment:
      LEO_LOGS_DB: /data/logs.db
      LEO_LOGS_TOKEN: ${LEO_LOGS_TOKEN:?Set LEO_LOGS_TOKEN in .env}
    volumes:
      - leo-logs:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LEO_LOGS_DOMAIN: ${LEO_LOGS_DOMAIN:-leologs.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy-config:/config
    depends_on:
      - leo-logs

volumes:
  leo-logs:
  caddy:
  caddy-config:
